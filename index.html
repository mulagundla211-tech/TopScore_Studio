<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopScore Inventory Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        #bootstrap-error { 
            display: none; 
            padding: 24px; 
            background: #fff1f2; 
            color: #9f1239; 
            border: 1px solid #fda4af; 
            margin: 20px; 
            border-radius: 12px; 
            font-family: ui-sans-serif, system-ui, sans-serif;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<script>
    console.log("HTML: System initializing...");
    window.onerror = function(msg, url, line, col, error) {
        console.error("BOOTSTRAP ERROR:", msg);
        var div = document.getElementById('bootstrap-error');
        if (div) {
            div.style.display = 'block';
            div.innerHTML = '<h3 style="margin-top:0;font-weight:700">Application Failed to Start</h3>' +
                            '<p style="margin-bottom:8px">' + msg + '</p>' +
                            '<p style="font-size:12px; color: #666;">Note: If you see a MIME type error, the <strong>_headers</strong> file is missing or has not been processed by your host yet.</p>';
        }
        return false;
    };
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="bootstrap-error"></div>
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #64748b; background: #f8fafc;">
            <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <p style="margin-top: 20px; font-weight: 700; font-family: sans-serif; letter-spacing: -0.01em; color: #1e293b;">Initializing Dashboard...</p>
            <p style="margin-top: 8px; font-size: 13px; color: #94a3b8; font-family: sans-serif;">Synchronizing with Google Sheets</p>
        </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
