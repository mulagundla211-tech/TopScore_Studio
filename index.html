<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopScore Inventory Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        #bootstrap-error { 
            display: none; 
            padding: 20px; 
            background: #fef2f2; 
            color: #991b1b; 
            border: 1px solid #fee2e2; 
            margin: 20px; 
            border-radius: 8px; 
            font-family: sans-serif; 
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<script>
    // Global error handler to catch boot-up issues
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errorDiv = document.getElementById('bootstrap-error');
        if (errorDiv) {
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = '<strong>Application Error:</strong> ' + msg + '<br><small>' + url + ' L:' + lineNo + '</small>';
        }
        return false;
    };
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="bootstrap-error"></div>
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #64748b;">
            <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="margin-top: 16px; font-weight: 600; font-family: sans-serif;">Initializing Dashboard...</p>
        </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
